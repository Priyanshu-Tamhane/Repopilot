[project]
name = "repopilot"
version = "0.1.0"
description = "RepoPilot - evaluation-driven coding-agent infrastructure (Phase 1: baseline)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "GitPython>=3.1.40",
    "docker>=7.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "groq>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "agents", "retrieval", "inference", "execution", "evaluation", "observability"]

[tool.ruff]
line-length = 100
target-version = "py310"
