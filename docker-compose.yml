services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./api:/app/api
      - ./agents:/app/agents
      - ./execution:/app/execution
      - ./inference:/app/inference
      - ./retrieval:/app/retrieval
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SANDBOX_MODE=docker

